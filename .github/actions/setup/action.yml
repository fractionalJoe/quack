name: Setup
description: Node and pnpm install, plus AWS credentials when a deploy role is given.

inputs:
  role-to-assume:
    description: Deploy role ARN to assume. Omit to skip credential configuration.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Setup pnpm and install
      uses: pnpm/action-setup@v6
      with:
        cache: true
        run_install: |
          - args: [--frozen-lockfile]

    - name: Read region
      id: config
      shell: bash
      run: echo "region=$(jq -r .primary.region config.json)" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      if: inputs.role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ steps.config.outputs.region }}
