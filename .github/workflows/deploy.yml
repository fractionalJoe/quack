name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Target deploy environment
        type: choice
        default: dev
        options:
          - dev
      infra:
        description: Deploy InfraStack
        type: boolean
        default: false
      compute:
        description: Deploy ComputeStack
        type: boolean
        default: false
      data:
        description: Deploy DataStack
        type: boolean
        default: false
      migrate:
        description: Deploy Migrations
        type: boolean
        default: false
      ducks:
        description: Deploy QuackDucksServiceStack
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      compute: ${{ steps.filter.outputs.compute }}
      data: ${{ steps.filter.outputs.data }}
      migrate: ${{ steps.filter.outputs.migrate }}
      ducks: ${{ steps.filter.outputs.ducks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - packages/infra/**
              - packages/libs/cdk/**
              - packages/libs/shared/**
              - .github/**
            compute:
              - packages/compute/**
              - packages/libs/cdk/**
              - packages/libs/shared/**
              - .github/**
            data:
              - packages/data/**
              - packages/libs/cdk/**
              - packages/libs/shared/**
              - .github/**
            migrate:
              - packages/libs/db/**
              - .github/**
            ducks:
              - packages/services/ducks/**
              - packages/libs/**
              - pnpm-workspace.yaml
              - .github/**

  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm typecheck && pnpm test:unit

  infra:
    needs: [changes, build]
    if: needs.changes.outputs.infra == 'true' || (github.event_name == 'workflow_dispatch' && inputs.infra)
    runs-on: ubuntu-latest
    # environment sets the OIDC subject to repo:<org>/<repo>:environment:<name>,
    # the only subject BootstrapIam.yaml trusts.
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy QuackInfraStack
        run: pnpm infra cdk deploy QuackInfraStack --require-approval never

  compute:
    needs: [changes, build, infra]
    # !cancelled() replaces the implied success(), which would skip this job
    # whenever infra is skipped. Build must pass and infra must pass or be
    # skipped; then run on a compute change or on dispatch with the compute input.
    if: >-
      !cancelled() && needs.build.result == 'success' && 
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (
        needs.changes.outputs.compute == 'true' || 
        (github.event_name == 'workflow_dispatch' && inputs.compute)
      )
    runs-on: ubuntu-latest
    # environment sets the OIDC subject to repo:<org>/<repo>:environment:<name>,
    # the only subject BootstrapIam.yaml trusts.
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy QuackComputeStack
        run: pnpm compute cdk deploy QuackComputeStack --require-approval never

  data:
    needs: [changes, build, infra]
    # !cancelled() replaces the implied success(), which would skip this job
    # whenever infra is skipped. Build must pass and infra must pass or be
    # skipped; then run on a data change or on dispatch with the data input.
    if: >-
      !cancelled() && needs.build.result == 'success' && 
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (
        needs.changes.outputs.data == 'true' || 
        (github.event_name == 'workflow_dispatch' && inputs.data)
      )
    runs-on: ubuntu-latest
    # environment sets the OIDC subject to repo:<org>/<repo>:environment:<name>,
    # the only subject BootstrapIam.yaml trusts.
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy QuackDataStack
        run: pnpm data cdk deploy QuackDataStack --require-approval never

  migrate:
    needs: [changes, build, data]
    # Same shape as data: build must pass, data must pass or be skipped,
    # then run on a migrations change or on dispatch with the migrate input.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.data.result == 'success' || needs.data.result == 'skipped') &&
      (
        needs.changes.outputs.migrate == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.migrate)
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_MIGRATE_ROLE_ARN }}

      - name: Read data parameters
        run: |
          echo "AWS_RDS_ARN=$(aws ssm get-parameter --name /quack/data/cluster-arn --query Parameter.Value --output text)" >> "$GITHUB_ENV"
          echo "AWS_RDS_SECRET_ARN=$(aws ssm get-parameter --name /quack/data/secret-arn --query Parameter.Value --output text)" >> "$GITHUB_ENV"

      - name: Wait for the cluster
        # A paused cluster rejects the first call while it resumes (DatabaseResumingException).
        run: |
          for attempt in {1..12}; do
            aws rds-data execute-statement --resource-arn "$AWS_RDS_ARN" --secret-arn "$AWS_RDS_SECRET_ARN" --database quack --sql "select 1" && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Migrate
        run: pnpm db migrate

  ducks:
    needs: [changes, build, compute, migrate]
    # Build must pass, compute and migrate must each pass or be skipped,
    # then run on a ducks change or on dispatch with the ducks input.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.compute.result == 'success' || needs.compute.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (
        needs.changes.outputs.ducks == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.ducks)
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.deploy_environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy QuackDucksServiceStack
        run: pnpm ducks cdk deploy QuackDucksServiceStack --require-approval never
